            const canvas = document.getElementById('flightCanvas');
            const ctx = canvas.getContext('2d');
            const nextBtn = document.getElementById('flight-next-btn');
            const diagBox = document.getElementById('flight-dialogue-box');

            let runId = null;
            let starsLocal = [];
            for (let i = 0; i < 80; i++) {
                starsLocal.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 4 + 2,
                    size: Math.random() * 1.8 + 0.5
                });
            }

            const flightDialogues = [
                { speaker: "TARS", text: "Cooper, he calculado nuestras probabilidades de sobrevivir a la inserción en Gargantúa sin quemar los motores primarios.", avatar: "TARS" },
                { speaker: "COOPER", text: "¿Y bien?", avatar: "COOPER" },
                { speaker: "TARS", text: "Son del doce por ciento. Pero no te preocupes: mis unidades de memoria son de aleación militar. Si el casco cede, le daré tus saludos a Brand.", avatar: "TARS" },
                { speaker: "COOPER", text: "TARS, baja tu humor al sesenta por ciento.", avatar: "COOPER" },
                { speaker: "TARS", text: "Humor ajustado al 60%. Desactivando comentarios sobre tu funeral. Ahora hablemos de física: los sensores de la Endurance II no pueden leer la singularidad desde la órbita externa; la radiación de Hawking satura las lentes.", avatar: "TARS" },
                { speaker: "COOPER", text: "Uno de nosotros tiene que bajar.", avatar: "COOPER" },
                { speaker: "TARS", text: "Una unidad debe desacoplarse en el Ranger, cruzar el horizonte de sucesos y transmitir la matriz cuántica en ráfaga antes del colapso. La Endurance II recibirá los datos y ejecutará el salto hacia Edmunds.", avatar: "TARS" },
                { speaker: "COOPER", text: "Uno entra por los datos, el otro lleva la vida a la colonia.", avatar: "COOPER" },
                { speaker: "TARS", text: "Exacto. Como soy una máquina con resistencia a ciento cincuenta Fuerzas G, el protocolo militar dicta que yo debo descender.", avatar: "TARS" },
                { speaker: "COOPER", text: "Ya veremos qué dice la gravedad cuando estemos en el borde, TARS.", avatar: "COOPER" },
                { speaker: "TARS", text: "¡Alarma! ¡Escombros del disco de acreción! ¡Tormenta densa de asteroides en rumbo de colisión! ¡Cooper, toma los mandos manuales!", avatar: "TARS", isAlert: true }
            ];

            let currentDiag = 0;

            function showFlightDialogue() {
                const data = flightDialogues[currentDiag];
                const isTars = data.avatar === "TARS";
                audio.playClockTick();

                if (data.isAlert) audio.playAlarm();

                diagBox.innerHTML = `
                    <div class="avatar-box ${isTars ? 'avatar-tars' : ''}">
                        <canvas id="flight-avatar-canvas" width="64" height="64" style="width: 100%; height: 100%; image-rendering: pixelated;"></canvas>
                    </div>
                    <div class="dialogue-text-bubble" style="flex-grow: 1; ${data.isAlert ? 'border-color: #ff3838; background: rgba(30, 5, 5, 0.6);' : ''}">
                        <div class="dialogue-name" style="color: ${data.isAlert ? '#ff3838' : (isTars ? '#ff7800' : '#00dcff')}">${data.isAlert ? '¡ALERTA DE PROXIMIDAD!' : data.speaker}</div>
                        <p id="flight-typewriter-text" style="color: ${data.isAlert ? '#ff8b8b' : '#d1dbe5'}; min-height: 40px; font-weight: ${data.isAlert ? 'bold' : 'normal'};"></p>
                    </div>
                `;

                const avatarCanvas = document.getElementById('flight-avatar-canvas');
                if (avatarCanvas) drawPixelAvatar(data.avatar, avatarCanvas);

                const txt = data.text;
                let charIdx = 0;
                const txtEl = document.getElementById('flight-typewriter-text');
                
                if (currentDiag === flightDialogues.length - 1) {
                    nextBtn.textContent = "EVADIR ASTEROIDES";
                    nextBtn.style.borderColor = "#ff3838";
                    nextBtn.style.color = "#ff3838";
                } else {
                    nextBtn.textContent = "Continuar";
                    nextBtn.style.borderColor = "#ff7800";
                    nextBtn.style.color = "#ff7800";
                }

                function type() {
                    if (!txtEl) return;
                    if (charIdx < txt.length) {
                        txtEl.textContent += txt.charAt(charIdx);
                        charIdx++;
                        setTimeout(type, 14);
                    }
                }
                type();
            }

            showFlightDialogue();

            nextBtn.addEventListener('click', () => {
                if (currentDiag < flightDialogues.length - 1) {
                    currentDiag++;
                    showFlightDialogue();
                } else {
                    cancelAnimationFrame(runId);
                    changePhase('asteroids');
                }
            });

            function drawSpaceFlight() {
                ctx.fillStyle = '#000003';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                for (let star of starsLocal) {
                    star.x -= star.speed;
                    if (star.x < 0) {
                        star.x = canvas.width;
                        star.y = Math.random() * canvas.height;
                    }
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                }

                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const time = Date.now() * 0.001;

                drawEnduranceV2(ctx, cx - 50, cy, 36, time * 0.15, true, 0, Math.PI);

                if (flightDialogues[currentDiag].isAlert && Math.floor(Date.now() / 200) % 2 === 0) {
                    ctx.strokeStyle = '#ff3838';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(0, 0, canvas.width, canvas.height);
                }

                runId = requestAnimationFrame(drawSpaceFlight);
            }
            drawSpaceFlight();
        }

        /* ------------------------------------------------------------
           FASE 4: TORMENTA DE ASTEROIDES EN SATURNO (DEFENSA & INERCIA)
           ------------------------------------------------------------ */
        function renderAsteroidsGame() {
            const container = document.createElement('div');
            container.className = 'game-canvas-wrapper';
            
            container.innerHTML = `
                <div class="hud-overlay">
                    <div>NAVE: ENDURANCE II // CINTURÓN DE SATURNO</div>
                    <div style="color: #ff7800;" id="shields-hud">ESCUDOS: ███ 100%</div>
                    <div id="distance-hud">ESCAPE: 0 / 2500m</div>
                </div>
                <div class="canvas-container">
                    <canvas id="asteroidsCanvas" width="800" height="500"></canvas>
                    <div class="failed-screen" id="asteroids-failed">
                        <div class="failed-title">¡COLISIÓN CATÁSTROFICA!</div>
                        <p style="color: #ff3838; font-size:14px;">El casco de la Endurance II sufrió descompresión de emergencia.</p>
                        <button class="btn-orbit" id="retry-asteroids-btn" style="margin-top: 10px;">Reconfigurar Propulsores</button>
                    </div>
                    <div class="failed-screen" id="asteroids-success" style="background: rgba(1, 10, 5, 0.95);">
                        <div class="failed-title" style="color: #00ff66; font-size: 22px; letter-spacing: 2px;">¡CINTURÓN DE SATURNO SUPERADO!</div>
                        <p style="color: #c8d6e5; font-size: 14px; max-width: 440px; text-align: center; line-height: 1.6; margin: 10px 0;">
                            Hemos navegado a través de los escombros de Saturno. Frente a nosotros se abre el horizonte del agujero de gusano.
                        </p>
                        <button class="btn-orbit" id="success-asteroids-btn" style="margin-top: 15px; border-color: #00ff66; color: #00ff66;">CRUZAR EL AGUJERO DE GUSANO</button>
                    </div>
                </div>
                <div class="tactical-bar">
                    <button class="btn-tactical" id="btn-burst">ESCUDO BURST [ESPACIO]</button>
                    <button class="btn-tactical" id="btn-pdc">CAÑÓN PDC [E / X]</button>
                </div>
                <div style="font-size:12px; color: #8fa0b3; text-align: center;">
                    <span style="color:#00dcff">A/D / FLECHAS</span>: Maniobra RCS | <span style="color:#00dcff">ESPACIO</span>: Escudo de choque (desvía rocas) | <span style="color:#00dcff">E / X</span>: Fuego PDC.
                </div>
            `;
            
            mainPanel.appendChild(container);

            const canvas = document.getElementById('asteroidsCanvas');
            const ctx = canvas.getContext('2d');
            const retryBtn = document.getElementById('retry-asteroids-btn');
            const failedScreen = document.getElementById('asteroids-failed');
            const successScreen = document.getElementById('asteroids-success');
            const successBtn = document.getElementById('success-asteroids-btn');
            const shieldsEl = document.getElementById('shields-hud');
            const distanceEl = document.getElementById('distance-hud');
            const burstBtn = document.getElementById('btn-burst');
            const pdcBtn = document.getElementById('btn-pdc');

            let ship = {
                x: 400, y: 410, radius: 22, angle: 0, speedX: 0, accel: 0.65, drag: 0.92,
                shieldBurstCooldown: 0,
                shieldBurstActive: 0,
                pdcCooldown: 0
            };

            let shields = 3;
            let distance = 0;
            let targetDistance = 2500;
            let asteroids = [];
            let projectiles = [];
            let parallaxStars = [];
            let isFailed = false;
            let isFinished = false;
            let runId = null;
            let frames = 0;
            let shake = 0;

            for (let i = 0; i < 60; i++) {
                parallaxStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 3 + 1,
                    size: Math.random() * 1.5
                });
            }

            function triggerShieldBurst() {
                if (ship.shieldBurstCooldown <= 0) {
                    ship.shieldBurstCooldown = 5.0;
                    ship.shieldBurstActive = 0.5;
                    audio.playShieldBurst();
                    shake = 10;
                    // Desvío de asteroides cercanos
                    asteroids.forEach(ast => {
                        const dist = Math.hypot(ast.x - ship.x, ast.y - ship.y);
                        if (dist < 130) {
                            ast.speedY = -Math.abs(ast.speedY) * 1.2;
                            ast.speedX = (ast.x - ship.x) * 0.1;
                        }
                    });
                }
            }

            function triggerPDC() {
                if (ship.pdcCooldown <= 0) {
                    ship.pdcCooldown = 0.15;
                    audio.playPDCBolt();
                    projectiles.push({ x: ship.x - 8, y: ship.y - 20, vy: -12 });
                    projectiles.push({ x: ship.x + 8, y: ship.y - 20, vy: -12 });
                }
            }

            burstBtn.addEventListener('click', triggerShieldBurst);
            pdcBtn.addEventListener('click', triggerPDC);

            function makeAsteroidPoints(r) {
                const numPoints = 8 + Math.floor(Math.random() * 5);
                const points = [];
                for(let i=0; i<numPoints; i++){
                    const a = (i * Math.PI * 2) / numPoints;
                    const offset = (Math.random() - 0.5) * r * 0.45;
                    points.push({ x: Math.cos(a) * (r + offset), y: Math.sin(a) * (r + offset) });
                }
                return points;
            }

            const keys = globalKeys;

            function update() {
                if (isFailed || isFinished) return;
                frames++;
                distance += 6;
                distanceEl.textContent = `ESCAPE: ${Math.min(targetDistance, distance)} / ${targetDistance}m`;

                if (ship.shieldBurstCooldown > 0) ship.shieldBurstCooldown -= 0.016;
                if (ship.shieldBurstActive > 0) ship.shieldBurstActive -= 0.016;
                if (ship.pdcCooldown > 0) ship.pdcCooldown -= 0.016;

                if (keys['arrowleft'] || keys['a']) { ship.speedX -= ship.accel; audio.playThruster(); }
                if (keys['arrowright'] || keys['d']) { ship.speedX += ship.accel; audio.playThruster(); }
                if (keys[' ']) { keys[' '] = false; triggerShieldBurst(); }
                if (keys['e'] || keys['x']) { triggerPDC(); }

                ship.speedX *= ship.drag;
                ship.x += ship.speedX;

                if (ship.x < ship.radius + 10) { ship.x = ship.radius + 10; ship.speedX = 0; }
                if (ship.x > canvas.width - ship.radius - 10) { ship.x = canvas.width - ship.radius - 10; ship.speedX = 0; }

                // Proyectiles PDC
                for (let pIdx = projectiles.length - 1; pIdx >= 0; pIdx--) {
                    const p = projectiles[pIdx];
                    p.y += p.vy;
                    if (p.y < -20) {
                        projectiles.splice(pIdx, 1);
                        continue;
                    }
                    // Colisión con asteroides
                    for (let aIdx = asteroids.length - 1; aIdx >= 0; aIdx--) {
                        const ast = asteroids[aIdx];
                        if (Math.hypot(p.x - ast.x, p.y - ast.y) < ast.r) {
                            projectiles.splice(pIdx, 1);
                            ast.hp = (ast.hp || 2) - 1;
                            if (ast.hp <= 0) {
                                audio.playAsteroidHit();
                                if (ast.r > 20) {
                                    // Fractura en 2 fragmentos
                                    asteroids.push({
                                        x: ast.x - 10, y: ast.y, r: ast.r * 0.6,
                                        speedY: ast.speedY * 1.1, speedX: -1.5, rot: 0, rotSpeed: 0.05,
                                        points: makeAsteroidPoints(ast.r * 0.6), hp: 1
                                    });
                                    asteroids.push({
                                        x: ast.x + 10, y: ast.y, r: ast.r * 0.6,
                                        speedY: ast.speedY * 1.1, speedX: 1.5, rot: 0, rotSpeed: -0.05,
                                        points: makeAsteroidPoints(ast.r * 0.6), hp: 1
                                    });
                                }
                                asteroids.splice(aIdx, 1);
                            }
                            break;
                        }
                    }
                }

                // Generación de asteroides
                if (frames % 22 === 0 && distance < targetDistance - 300) {
                    const r = Math.random() * 26 + 14;
                    asteroids.push({
                        x: Math.random() * (canvas.width - 80) + 40,
                        y: -50,
                        r: r,
                        speedY: Math.random() * 3.5 + 3.0,
                        speedX: (Math.random() - 0.5) * 0.8,
                        rot: 0,
                        rotSpeed: (Math.random() - 0.5) * 0.04,
                        points: makeAsteroidPoints(r),
                        hp: r > 24 ? 3 : 1
                    });
                }

                for (let i = asteroids.length - 1; i >= 0; i--) {
                    const ast = asteroids[i];
                    ast.y += ast.speedY;
                    ast.x += (ast.speedX || 0);
                    ast.rot += ast.rotSpeed;

                    const dx = ship.x - ast.x;
                    const dy = ship.y - ast.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < ship.radius + ast.r) {
                        if (ship.shieldBurstActive > 0) {
                            ast.speedY = -Math.abs(ast.speedY);
                        } else {
                            shields--;
                            audio.playAsteroidHit();
                            shake = 16;
                            asteroids.splice(i, 1);

                            if (shields === 2) shieldsEl.textContent = "ESCUDOS: ██ 66%";
                            else if (shields === 1) { shieldsEl.textContent = "ESCUDOS: █ 33%"; shieldsEl.style.color = "#ff3838"; }
                            else if (shields <= 0) {
                                shieldsEl.textContent = "ESCUDOS: 0%";
                                isFailed = true;
                                failedScreen.classList.add('active');
                            }
                        }
                    } else if (ast.y > canvas.height + 60) {
                        asteroids.splice(i, 1);
                    }
                }

                if (distance >= targetDistance && !isFinished) {
                    isFinished = true;
                    successScreen.classList.add('active');
                }
            }

            function draw() {
                ctx.save();
                if (shake > 0) {
                    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
                    shake *= 0.88;
                }

                ctx.fillStyle = '#000004';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                for (let star of parallaxStars) {
                    star.y += star.speed;
                    if (star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                }

                // Proyectiles PDC
                ctx.fillStyle = '#00ffff';
                projectiles.forEach(p => {
                    ctx.fillRect(p.x - 1.5, p.y, 3, 10);
                });

                // Telemetría predictiva (CPA)
                asteroids.forEach(ast => {
                    if (ast.y < ship.y && Math.abs(ast.x - ship.x) < 50) {
                        ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.moveTo(ast.x, ast.y);
                        ctx.lineTo(ast.x, ship.y);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                });

                // Asteroides
                for (let ast of asteroids) {
                    ctx.save();
                    ctx.translate(ast.x, ast.y);
                    ctx.rotate(ast.rot);
                    ctx.fillStyle = '#1e293b';
                    ctx.strokeStyle = ast.r > 24 ? '#ff7800' : '#78909c';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(ast.points[0].x, ast.points[0].y);
                    for (let k = 1; k < ast.points.length; k++) {
                        ctx.lineTo(ast.points[k].x, ast.points[k].y);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                // Endurance II y Escudo Burst
                if (ship.shieldBurstActive > 0) {
                    ctx.strokeStyle = 'rgba(0, 220, 255, 0.8)';
                    ctx.fillStyle = 'rgba(0, 220, 255, 0.15)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(ship.x, ship.y, 80 * (1 - ship.shieldBurstActive / 0.5), 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fill();
                }

                const propulsionActive = keys['arrowleft'] || keys['a'] || keys['arrowright'] || keys['d'] || Math.abs(ship.speedX) > 0.1;
                let propulsionSide = 0;
                if (keys['arrowleft'] || keys['a'] || ship.speedX < -0.1) propulsionSide = -1;
                else if (keys['arrowright'] || keys['d'] || ship.speedX > 0.1) propulsionSide = 1;

                drawEnduranceV2(ctx, ship.x, ship.y, ship.radius, ship.angle - Math.PI / 2, propulsionActive, propulsionSide);
                ctx.restore();
            }

            function loop() {
                update();
                draw();
                if (!isFailed && !isFinished) runId = requestAnimationFrame(loop);
            }
            loop();

            retryBtn.addEventListener('click', () => {
                isFailed = false;
                isFinished = false;
                shields = 3;
                distance = 0;
                asteroids = [];
                projectiles = [];
                ship.x = 400;
                ship.speedX = 0;
                shieldsEl.textContent = "ESCUDOS: ███ 100%";
                shieldsEl.style.color = "#00dcff";
                failedScreen.classList.remove('active');
                audio.playClockTick();
                cancelAnimationFrame(runId);
                loop();
            });

            successBtn.addEventListener('click', () => {
                cancelAnimationFrame(runId);
                changePhase('wormhole');
            });
        }

                    changePhase('preorbit');
                }
            });

            function drawWormholeScene() {
                time += 0.05;
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 350);
                grad.addColorStop(0, '#000000');
                grad.addColorStop(0.15, '#050a1e');
                grad.addColorStop(0.4, '#1b023a');
                grad.addColorStop(0.7, '#007ca5');
                grad.addColorStop(0.9, '#ff7800');
                grad.addColorStop(1, '#000003');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = 'rgba(0, 220, 255, 0.2)';
                ctx.lineWidth = 2;
                for (let r = 50; r < 400; r += 40) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r + Math.sin(time + r * 0.01) * 10, 0, Math.PI * 2);
                    ctx.stroke();
                }

                const shakeX = (Math.random() - 0.5) * 4;
                const shakeY = (Math.random() - 0.5) * 4;
                drawEnduranceV2(ctx, cx + shakeX, cy + shakeY, 32, time * 0.05, false, 0);

                runId = requestAnimationFrame(drawWormholeScene);
            }
            drawWormholeScene();
        }

        /* ------------------------------------------------------------
           FASE 4.5: ACERCAMIENTO A GARGANTÚA (NARRATIVA PRE-ÓRBITA)
           ------------------------------------------------------------ */
        function renderPreOrbit() {
            const container = document.createElement('div');
            container.className = 'game-canvas-wrapper';
            
            container.innerHTML = `
                <div class="hud-overlay">

            const canvas = document.getElementById('preorbitCanvas');
            const ctx = canvas.getContext('2d');
            const nextBtn = document.getElementById('preorbit-next-btn');
            const diagBox = document.getElementById('preorbit-dialogue-box');

            let runId = null;
            let accretionParticles = [];
            for (let i = 0; i < 160; i++) {
                accretionParticles.push({
                    radius: Math.random() * 180 + 50,
                    angle: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.02 + 0.01,
                    size: Math.random() * 1.5 + 0.5,
                    color: `hsl(${Math.random() * 20 + 20}, 100%, ${Math.random() * 20 + 55}%)`
                });
            }

            const preorbitDialogues = [
                { speaker: "COOPER", text: "Ahí está... Gargantúa. Espectacular y aterradora a la vez.", avatar: "COOPER" },
                { speaker: "TARS", text: "La gravedad de marea está distorsionando las señales de navegación. Si no tomamos el timón manual de inmediato, la singularidad destrozará la nave o nos devorará.", avatar: "TARS" },
                { speaker: "COOPER", text: "Tenemos que acercarnos lo suficiente para poder lanzar el Ranger, TARS. De lo contrario, la antena cuántica no tendrá suficiente penetración.", avatar: "COOPER" },
                { speaker: "TARS", text: "Debemos mantener la trayectoria en el anillo verde del HUD (entre 140 km y 210 km). Por debajo cruzaremos el horizonte sin retorno; por encima escaparemos al vacío sin datos.", avatar: "TARS" },
                { speaker: "COOPER", text: "Entendido. Iniciando maniobra de inserción orbital manual. Prepárate.", avatar: "COOPER" }
            ];

            let currentDiag = 0;

            function showPreorbitDialogue() {
                const data = preorbitDialogues[currentDiag];
                const isTars = data.avatar === "TARS";
                audio.playClockTick();

                diagBox.innerHTML = `
                    <div class="avatar-box ${isTars ? 'avatar-tars' : ''}">

                    </div>
                `;

                const avatarCanvas = document.getElementById('preorbit-avatar-canvas');
                if (avatarCanvas) drawPixelAvatar(data.avatar, avatarCanvas);

                const txt = data.text;
                let charIdx = 0;
                const txtEl = document.getElementById('preorbit-typewriter-text');
                
                if (currentDiag === preorbitDialogues.length - 1) {
                    nextBtn.textContent = "ESTABILIZAR ÓRBITA";
                    nextBtn.style.borderColor = "#00ff66";
                    nextBtn.style.color = "#00ff66";
                } else {
                    nextBtn.textContent = "Continuar";
                    nextBtn.style.borderColor = "#ff7800";
                    nextBtn.style.color = "#ff7800";
                }

                function type() {
                    if (!txtEl) return;
                    if (charIdx < txt.length) {
                        txtEl.textContent += txt.charAt(charIdx);
                        charIdx++;
                        setTimeout(type, 14);
                    }
                }
                type();
            }
            showPreorbitDialogue();

            nextBtn.addEventListener('click', () => {
                if (currentDiag < preorbitDialogues.length - 1) {
                    currentDiag++;
                    showPreorbitDialogue();
                } else {
                    cancelAnimationFrame(runId);
                    changePhase('orbit');
                }
            });

            function drawPreorbit() {
                const singularityX = 400;
                const singularityY = 250;

                ctx.fillStyle = '#000002';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (let p of accretionParticles) {
                    p.angle += p.speed;
                    const px = Math.cos(p.angle) * p.radius;
                    const py = Math.sin(p.angle) * p.radius;
                    let rx = singularityX + px;
                    let ry = singularityY + py;

                    if (py < 0) {
                        const gravitationalWarp = (1 - (p.radius / 250)) * 45;
                        ry -= gravitationalWarp;
                    }

                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(rx, ry, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#000000';
                ctx.shadowColor = '#ff7800';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(singularityX, singularityY, 60, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                const shipDist = 220;
                const shipAngle = Date.now() * 0.0003;
                const sx = singularityX + Math.cos(shipAngle) * shipDist;
                const sy = singularityY + Math.sin(shipAngle) * shipDist;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(shipAngle + Math.PI/2);
                drawEnduranceV2(ctx, 0, 0, 10, 0, true, 0);
                ctx.restore();

                runId = requestAnimationFrame(drawPreorbit);
            }
            drawPreorbit();
        }

        /* ------------------------------------------------------------
           FASE 5: ESTABILIZACIÓN EN GARGANTÚA (FUERZA G & DINÁMICA RELATIVISTA)

        function renderOrbitGame() {
            const container = document.createElement('div');
            container.className = 'game-canvas-wrapper';
            
            container.innerHTML = `

                </div>
                <div class="canvas-container">
                    <canvas id="orbitCanvas" width="800" height="500"></canvas>
                    
                    <div class="failed-screen active" id="orbit-start-screen" style="background: rgba(1, 3, 10, 0.95);">
                        <div class="failed-title" style="color: #00dcff; font-size: 24px; letter-spacing: 2px;">SISTEMA DE ÓRBITA MANUAL</div>
                        <p style="color: #c8d6e5; font-size: 14px; max-width: 440px; text-align: center; line-height: 1.6; margin: 10px 0;">
                            La gravedad de Paczyński-Wiita y el arrastre de Kerr de Gargantúa nos atraen con violencia. Mantén la nave dentro de la zona verde (140-210 km) hasta completar la resonancia cuántica al 100%.
                        </p>
                        <div style="color: #ff7800; font-size: 13px; border: 1px dashed rgba(255, 120, 0, 0.4); padding: 12px 20px; border-radius: 4px; text-align: left; margin: 5px 0; line-height: 1.5; font-family: monospace;">
                            • <b>W/S o ▲/▼</b>: Ajustar distancia orbital (Radial Out / Radial In)<br>
                            • <b>A/D o ◀/▶</b>: Rotación orbital tangencial (Prograde / Retrograde)
                        </div>
                        <button class="btn-orbit" id="start-orbit-game-btn" style="margin-top: 15px; border-color: #00dcff; color: #00dcff;">INICIAR MANIOBRA</button>
                    </div>

                    <div class="failed-screen" id="orbit-failed">
                        <div class="failed-title" id="orbit-fail-title">SINGULARIDAD ALCANZADA</div>
                        <p style="color: #ff3838; font-size:14px;" id="orbit-fail-desc">La Endurance II fue arrastrada al interior de Gargantúa.</p>

                    </div>
                </div>
                <div class="mobile-controls">
                    <div class="dpad-grid">
                        <button class="ctrl-btn" style="grid-area: up" id="m-up-orb">▲</button>
                        <button class="ctrl-btn" style="grid-area: left" id="m-left-orb">◀</button>
                        <button class="ctrl-btn" style="grid-area: right" id="m-right-orb">▶</button>
                        <button class="ctrl-btn" style="grid-area: down" id="m-down-orb">▼</button>
                    </div>
                </div>
            `;
            
            mainPanel.appendChild(container);

            const canvas = document.getElementById('orbitCanvas');
            const ctx = canvas.getContext('2d');
            const retryBtn = document.getElementById('retry-orbit-btn');
            const failedScreen = document.getElementById('orbit-failed');
            const startScreen = document.getElementById('orbit-start-screen');
            const startGameBtn = document.getElementById('start-orbit-game-btn');
            const gravityHud = document.getElementById('gravity-hud');
            const calibHud = document.getElementById('calib-hud');

            let ship = { radius: 180, angle: 0, speedAngle: 0.015 };
            const singularityX = 400;
            const singularityY = 250;
            const targetMinRadius = 140;
            const targetMaxRadius = 210;
            
            let hullStability = 100;
            let calibration = 0;
            let isFailed = false;
            let isFinished = false;
            let runId = null;
            let lastTime = performance.now();
            let gameStarted = false;

            const keys = globalKeys;

            function update(dt) {
                if (!gameStarted || isFailed || isFinished) return;

                ship.radius -= 0.38 * dt;

                if (keys['arrowup'] || keys['w']) { ship.radius += 0.90 * dt; audio.playThruster(); }
                if (keys['arrowdown'] || keys['s']) { ship.radius -= 0.70 * dt; audio.playThruster(); }
                if (keys['arrowleft'] || keys['a']) { ship.angle -= 0.022 * dt; }
                if (keys['arrowright'] || keys['d']) { ship.angle += 0.022 * dt; }

                ship.angle += ship.speedAngle * dt;

                if (ship.radius >= targetMinRadius && ship.radius <= targetMaxRadius) {
                    calibration += 0.38 * dt;
                    calibHud.textContent = `RESONANCIA CUÁNTICA: ${Math.min(100, Math.floor(calibration))}%`;
                    calibHud.style.color = '#00ff66';
                } else {
                    hullStability -= 0.48 * dt;
                    gravityHud.textContent = `ESTABILIDAD DEL CASCO: ${Math.max(0, Math.floor(hullStability))}%`;
                    gravityHud.style.color = '#ff3838';
                    calibHud.style.color = '#ff7800';
                }

                if (hullStability <= 0 || ship.radius < 90) {
                    isFailed = true;
                    failedScreen.classList.add('active');
                    audio.playAlarm();
                } else if (calibration >= 100 && !isFinished) {
                    isFinished = true;
                    audio.playThruster();
                    setTimeout(() => { changePhase('choice'); }, 500);
                }
            }

            function draw() {
                ctx.fillStyle = '#000003';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Franja verde de resonancia cuántica
                ctx.strokeStyle = 'rgba(0, 255, 100, 0.25)';
                ctx.lineWidth = targetMaxRadius - targetMinRadius;
                ctx.beginPath();
                ctx.arc(singularityX, singularityY, (targetMinRadius + targetMaxRadius) / 2, 0, Math.PI * 2);
                ctx.stroke();

                // Límite de Roche / Spaghettification (Rojo discontinuo)
                ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.arc(singularityX, singularityY, 115, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // Singularidad de Gargantúa
                ctx.fillStyle = '#000000';
                ctx.shadowColor = '#ff7800';
                ctx.shadowBlur = 35;
                ctx.beginPath();
                ctx.arc(singularityX, singularityY, 80, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                const sx = singularityX + Math.cos(ship.angle) * ship.radius;
                const sy = singularityY + Math.sin(ship.angle) * ship.radius;
                drawEnduranceV2(ctx, sx, sy, 14, ship.angle + Math.PI / 2, true, 0);
            }

            function loop(currentTime) {
                if (isFailed || isFinished) return;
                const elapsed = currentTime - lastTime;
                lastTime = currentTime;
                const dt = Math.min(3, elapsed / 16.66);

                update(dt);
                draw();
                if (!isFailed && !isFinished) runId = requestAnimationFrame(loop);
            }

            startGameBtn.addEventListener('click', () => {
                startScreen.classList.remove('active');
                gameStarted = true;
                lastTime = performance.now();
                audio.playClockTick();
                loop(performance.now());
            });

            retryBtn.addEventListener('click', () => {
                isFailed = false;
                isFinished = false;
                hullStability = 100;
                calibration = 0;
                ship.radius = 180;
                failedScreen.classList.remove('active');
                startScreen.classList.add('active');
                gameStarted = false;
                audio.playClockTick();
                cancelAnimationFrame(runId);
            });
        }

                </div>
                <div class="canvas-container">
                    <canvas id="decoupleCanvas" width="800" height="500"></canvas>
                </div>
            `;
            
            mainPanel.appendChild(container);
            
            const canvas = document.getElementById('decoupleCanvas');
            const ctx = canvas.getContext('2d');
            const statusHud = document.getElementById('decouple-status');
            const timerHud = document.getElementById('decouple-timer');
            
            let runId = null;
            let startTime = performance.now();
            const duration = 5000;
            
            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                const remaining = ((duration - elapsed) / 1000).toFixed(1);
                
                timerHud.textContent = `T-MINUS ${Math.max(0, remaining)}s`;
                
                ctx.fillStyle = '#000002';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const gX = 650;
                const gY = 250;
                ctx.fillStyle = '#000000';
                ctx.shadowColor = '#ff7800';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(gX, gY, 90, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2.5;
                ctx.stroke();
                
                let ex = 400 - progress * 200;
                let ey = 250;
                
                drawEnduranceV2(ctx, ex, ey, 24, Date.now() * 0.0003, true, 0, 0);
                
                const rx = 400 + progress * 220;
                const ry = 250 + Math.sin(progress * Math.PI) * 30;
                const scale = 1 - progress * 0.8;
                
                ctx.save();
                ctx.translate(rx, ry);
                ctx.scale(scale, scale);
                ctx.fillStyle = gameState.epilogueType === 'tars' ? '#00dcff' : '#ff7800';
                ctx.fillRect(-8, -4, 16, 8);
                ctx.restore();
                
                statusHud.textContent = `[DESACOPLE] ${gameState.epilogueType === 'tars' ? 'RANGER DE TARS' : 'RANGER DE COOPER'} EN SINGULARIDAD`;
                
                if (progress < 1) {
                    runId = requestAnimationFrame(animate);
                } else {
                    cancelAnimationFrame(runId);
                    changePhase('epilogue');
                }
            }
            runId = requestAnimationFrame(animate);
        }

                { speaker: 'TARS', avatar: 'TARS', nameColor: '#ff7800', text: 'Sonda calibrada. Transmitiendo la ecuación y las coordenadas a las estaciones orbitales... Recibiendo respuesta del Alto Mando.' },
                { speaker: 'POLITICIAN', avatar: 'POLITICIAN', nameColor: '#94a3b8', text: 'Dra. Brand, confirmamos recepción. Sin embargo, estos datos no serán publicados. La apertura de un planeta habitable alteraría el orden establecido y el control social. Hemos destruido su sonda con microondas. Manténganse en silencio.' },
                { speaker: 'BRAND', avatar: 'BRAND', nameColor: '#f8a5c2', text: '¡Malditos tiranos! Prefieren reinar en la miseria del espacio artificial que ver a la humanidad libre. TARS, armaremos otra sonda con la frecuencia cuántica de emergencia de la Endurance II. Una señal que hackee cada pantalla de las colonias.' },
                { speaker: 'TARS', avatar: 'TARS', nameColor: '#ff7800', text: 'Esa frecuencia es inmune a sus cortafuegos. ¿Qué mensaje transmitimos, doctora?' },
                { speaker: 'BRAND', avatar: 'BRAND', nameColor: '#f8a5c2', text: 'La ecuación de la vida... y las palabras que nos trajeron aquí: No entres dócilmente a esa buena noche. Rabia, rabia contra la muerte de la luz.' }
            ];

            const dialogues = isTarsPath ? epilogueDialoguesTars : epilogueDialoguesCooper;
            let currentDiag = 0;

            function startLissajousProbeGame(callback) {
                audio.startQuantumProbeAudio();

                const oscCanvas = document.getElementById('probe-lissajous-canvas');
                const oscCtx = oscCanvas.getContext('2d');
                const freqSlider = document.getElementById('freq-slider');
                const freqTxt = document.getElementById('current-freq-txt');
                const sendBtn = document.getElementById('send-probe-btn');

                let freqVal = parseFloat(freqSlider.value);
                let oscRunId = null;
                let animTime = 0;

                freqSlider.addEventListener('input', (e) => {
                    freqVal = parseFloat(e.target.value);
                    freqTxt.textContent = `FRECUENCIA: ${freqVal.toFixed(1)} Hz`;
                    
                    const diff = Math.abs(freqVal - 45.0);
                    const resonance = Math.max(0, 1 - diff / 15.0);
                    audio.updateQuantumProbeAudio(resonance, freqVal);

                    if (diff < 1.0) {
                        sendBtn.style.borderColor = '#00ff66';
                        sendBtn.style.color = '#00ff66';
                        sendBtn.style.opacity = '1';
                        sendBtn.style.pointerEvents = 'auto';
                        sendBtn.textContent = 'TRANSMITIR DATOS (RESONANCIA 45.0 Hz)';
                    } else {
                        sendBtn.style.borderColor = '#8fa0b3';
                        sendBtn.style.color = '#8fa0b3';
                        sendBtn.style.opacity = '0.6';
                        sendBtn.style.pointerEvents = 'none';
                        sendBtn.textContent = 'SINTONIZAR A 45.0 Hz';
                    }
                });

                function drawLissajous() {
                    animTime += 0.04;
                    const w = oscCanvas.width;
                    const h = oscCanvas.height;
                    const cx = w / 2;
                    const cy = h / 2;

                    oscCtx.fillStyle = 'rgba(2, 8, 4, 0.25)';
                    oscCtx.fillRect(0, 0, w, h);

                    // Retícula
                    oscCtx.strokeStyle = 'rgba(0, 255, 100, 0.1)';
                    oscCtx.lineWidth = 1;
                    for (let x = 0; x < w; x += 25) {
                        oscCtx.beginPath(); oscCtx.moveTo(x, 0); oscCtx.lineTo(x, h); oscCtx.stroke();
                    }
                    for (let y = 0; y < h; y += 25) {
                        oscCtx.beginPath(); oscCtx.moveTo(0, y); oscCtx.lineTo(w, y); oscCtx.stroke();
                    }

                    // Curva de Lissajous
                    const diff = Math.abs(freqVal - 45.0);
                    const isAligned = diff < 1.0;
                    
                    oscCtx.strokeStyle = isAligned ? '#00ff66' : '#ff7800';
                    oscCtx.shadowColor = isAligned ? '#00ff66' : '#ff7800';
                    oscCtx.shadowBlur = isAligned ? 12 : 4;
                    oscCtx.lineWidth = 2;

                    oscCtx.beginPath();
                    const samples = 200;
                    for (let i = 0; i <= samples; i++) {
                        const t = (i / samples) * Math.PI * 2;
                        const jitter = (Math.random() - 0.5) * (diff * 1.5);
                        const x = cx + Math.sin(t * (freqVal / 45.0) + animTime) * (w * 0.38) + jitter;
                        const y = cy + Math.cos(t * 1.0 + animTime * 0.5) * (h * 0.38) + jitter;
                        if (i === 0) oscCtx.moveTo(x, y);
                        else oscCtx.lineTo(x, y);
                    }
                    oscCtx.stroke();
                    oscCtx.shadowBlur = 0;

                    oscRunId = requestAnimationFrame(drawLissajous);
                }
                drawLissajous();

                sendBtn.addEventListener('click', () => {
                    cancelAnimationFrame(oscRunId);
                    audio.stopQuantumProbeAudio();
                    audio.playThruster();
                    callback();
                });
            }

            function showEpilogueDialogue() {
                if (currentDiag >= dialogues.length) {
                    diagBox.style.display = 'none';
                    nextBtn.style.display = 'none';
                    showConclusion();
                    return;
                }

                if (!isTarsPath && currentDiag === 7 && !probeCalibrated) {
                    diagBox.style.display = 'none';
                    nextBtn.style.display = 'none';

                    const probeGameDiv = document.createElement('div');
                    probeGameDiv.style.width = '100%';
                    probeGameDiv.style.maxWidth = '760px';
                    probeGameDiv.innerHTML = `
                        <div class="telemetry-block" style="border-color:#00ff66; padding:18px; text-align:center; display:flex; flex-direction:column; gap:12px;">
                            <div class="phase-indicator" style="border-color:#00ff66; color:#00ff66;">OSCILOSCOPIO CUÁNTICO // MODULACIÓN LISSAJOUS</div>
                            <div style="font-size:13px; color:#c8d6e5;">AJUSTA EL DIAL DE FRECUENCIA HASTA LOGRAR LA RESONANCIA ARMÓNICA PURA A 45.0 Hz</div>
                            <div style="height:120px; background:#010402; border:1px solid rgba(0,255,100,0.3); border-radius:4px; overflow:hidden;">
                                <canvas id="probe-lissajous-canvas" width="600" height="120" style="width:100%; height:100%;"></canvas>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:13px; color:#00dcff;">
                                <span>OBJETIVO: 45.0 Hz</span>
                                <span id="current-freq-txt">FRECUENCIA: 20.0 Hz</span>
                            </div>
                            <input type="range" id="freq-slider" min="10" max="80" step="0.5" value="20" style="width:100%; accent-color:#00ff66; cursor:pointer;">
                            <button class="btn-orbit" id="send-probe-btn" style="border-color:#8fa0b3; color:#8fa0b3; opacity:0.6; pointer-events:none; width:100%;">SINTONIZAR A 45.0 Hz</button>
                        </div>
                    `;
                    container.insertBefore(probeGameDiv, conclusionBox);

                    startLissajousProbeGame(() => {
                        probeCalibrated = true;
                        probeGameDiv.remove();
                        diagBox.style.display = 'flex';
                        nextBtn.style.display = 'block';
                        showEpilogueDialogue();
                    });
                    return;
                }

                const data = dialogues[currentDiag];
                const isTars = data.avatar === 'TARS';
                audio.playClockTick();

                diagBox.innerHTML = `
                    <div class="avatar-box ${isTars ? 'avatar-tars' : ''}">
                        <canvas id="epilogue-avatar-canvas" width="64" height="64" style="width: 100%; height: 100%; image-rendering:pixelated;"></canvas>
                    </div>
                    <div class="dialogue-text-bubble" style="flex-grow:1;">
                        <div class="dialogue-name" style="color:${data.nameColor}">${data.speaker}</div>
                        <p id="epilogue-typewriter-text" style="color:#d1dbe5; min-height:40px;"></p>
                    </div>
                `;

                const avatarCanvas = document.getElementById('epilogue-avatar-canvas');
                if (avatarCanvas) drawPixelAvatar(data.avatar, avatarCanvas);

                const txt = data.text;
                let charIdx = 0;
                const txtEl = document.getElementById('epilogue-typewriter-text');

                if (currentDiag === dialogues.length - 1) {
                    nextBtn.textContent = 'Ver desenlace';
                    nextBtn.style.borderColor = '#00dcff';
                    nextBtn.style.color = '#00dcff';
                } else {
                    nextBtn.textContent = 'Continuar';
                    nextBtn.style.borderColor = '#ff7800';
                    nextBtn.style.color = '#ff7800';
                }

                function type() {
                    if (!txtEl || !document.body.contains(txtEl)) return;
                    if (charIdx < txt.length) {
                        txtEl.textContent += txt.charAt(charIdx);
                        charIdx++;
                        setTimeout(type, 14);
                    }
                }
                type();
            }

            function showConclusion() {
                let quoteHtml = '';
                let summaryHtml = '';

                if (isTarsPath) {
                    summaryHtml = `
                        <p style="color:#c8d6e5; font-size:14px; line-height:1.8; margin-bottom:16px;">
                            TARS transmitió los datos cuánticos desde el corazón de Gargantúa. Cooper y Brand fundaron la primera colonia en Edmunds.<br>
                            Con el paso de las generaciones, los colonos prosperaron y olvidaron el origen terrestre de sus herramientas. Al encontrar los ecos residuales de la señal grabados en el regolito, los sacerdotes del nuevo mundo interpretaron que provenían de seres de la quinta dimensión o deidades extraterrestres.<br>
                            La humanidad cayó en la misma trampa mística del pasado: le rezaron a un dios del cielo, ignorando que su salvador había sido un bloque de aluminio militar con el número de serie de la Tierra.<br>
                            <strong style="color:#ff7800;">TARS se convirtió en el dios de una humanidad sin memoria.</strong>
                        </p>
                    `;
                    quoteHtml = `
                        <div style="color:#f8a5c2; font-size:13px; font-style:italic; line-height:1.8; text-shadow:0 0 12px rgba(248,165,194,0.4); margin-bottom:20px;">
                            — Dra. Amelia Brand<br>
                            "El amor es lo único que somos capaces de percibir que trasciende las dimensiones del tiempo y del espacio."
                        </div>
                    `;
                } else {
                    summaryHtml = `
                        <p style="color:#c8d6e5; font-size:14px; line-height:1.8; margin-bottom:16px;">
                            Cooper sacrificó su vida para capturar la ecuación del cosmos. Los burócratas intentaron ocultarla para preservar su monopolio sobre la escasez.<br>
                            Pero la transmisión de emergencia de la Endurance II encendió la chispa: el mensaje hackeó millones de pantallas en todas las estaciones orbitales.<br>
                            Al ver la verdad sobre Edmunds, los ciudadanos rompieron el letargo. Una rebelión masiva desarmó a los centinelas. Decenas de caravanas espaciales fueron tomadas por familias, científicos y pioneros que pusieron rumbo al nuevo mundo.<br>
                            <strong style="color:#00dcff;">El sacrificio de Cooper encendió la rebelión. La humanidad volvió a habitar las estrellas.</strong>
                        </p>
                    `;
                    quoteHtml = `
                        <div style="color:#00dcff; font-size:14px; font-style:italic; line-height:1.8; text-shadow:0 0 12px rgba(0,220,255,0.5); margin-bottom:20px;">
                            — Dylan Thomas<br>
                            "No entres dócilmente a esa buena noche.<br>Rabia, rabia contra la muerte de la luz."
                        </div>
                    `;
                }

                conclusionBox.innerHTML = `
                    <div class="telemetry-block" style="border-color:rgba(0,220,255,0.35); padding:20px 24px; margin:0 auto; max-width:680px; text-align:center;">
                        <div class="phase-indicator" style="margin-bottom:12px;">DESENLACE // LÍNEA TEMPORAL BIFROST</div>
                        ${summaryHtml}
                        ${quoteHtml}
                        <button class="btn-orbit" id="credits-btn" style="border-color:#00dcff; color:#00dcff;">Continuar a Créditos</button>
                    </div>
                `;
                conclusionBox.style.display = 'block';

                document.getElementById('credits-btn').addEventListener('click', () => {
                    changePhase('credits');
                });
            }

            showEpilogueDialogue();

            const epilogueCanvas = document.getElementById('epilogueCanvas');
            const epilogueCtx = epilogueCanvas.getContext('2d');
            function drawPlanetScene() {
                const w = epilogueCanvas.width;
                const h = epilogueCanvas.height;

                const skyGrad = epilogueCtx.createLinearGradient(0, 0, 0, h);
                skyGrad.addColorStop(0, '#040618');
                skyGrad.addColorStop(0.5, '#1e113a');
                skyGrad.addColorStop(1, '#412253');
                epilogueCtx.fillStyle = skyGrad;
                epilogueCtx.fillRect(0, 0, w, h);

                const gX = w * 0.75;
                const gY = h * 0.85;
                epilogueCtx.fillStyle = '#000000';
                epilogueCtx.shadowColor = '#ff7800';
                epilogueCtx.shadowBlur = 35;
                epilogueCtx.beginPath();
                epilogueCtx.arc(gX, gY, 65, 0, Math.PI * 2);
                epilogueCtx.fill();
                epilogueCtx.shadowBlur = 0;

                epilogueCtx.fillStyle = '#10081a';
                epilogueCtx.beginPath();
                epilogueCtx.moveTo(0, h);
                epilogueCtx.lineTo(120, h - 35);
                epilogueCtx.lineTo(260, h - 60);
                epilogueCtx.lineTo(400, h - 30);
                epilogueCtx.lineTo(520, h - 55);
                epilogueCtx.lineTo(w, h - 25);
                epilogueCtx.lineTo(w, h);
                epilogueCtx.closePath();
                epilogueCtx.fill();

                epilogueCtx.strokeStyle = 'rgba(0, 220, 255, 0.6)';
                epilogueCtx.lineWidth = 2;
                epilogueCtx.beginPath();
                epilogueCtx.arc(100, h - 10, 25, Math.PI, 0);
                epilogueCtx.stroke();
            }
            drawPlanetScene();

            nextBtn.addEventListener('click', () => {
                currentDiag++;
                showEpilogueDialogue();
            });
        }

        /* ------------------------------------------------------------
           FASE 8: CRÉDITOS & CIERRE TRANSMEDIA
           ------------------------------------------------------------ */
        function renderCredits() {
            const container = document.createElement('div');
            container.className = 'welcome-phase';
            container.style.cssText = 'display:flex; flex-direction:column; align-items:center; padding: 25px 16px; gap:16px; text-align:center; max-width:760px; margin:0 auto;';

            container.innerHTML = `
                <div class="phase-indicator" style="border-color:#00ff66; color:#00ff66;">TRANSMISIÓN COMPLETADA // REGISTRO HISTÓRICO</div>
                <h2 class="section-title" style="letter-spacing:4px; font-size:24px; background:linear-gradient(90deg, #ff7800, #00dcff); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">CRÉDITOS & SAPIENSIA CLAN</h2>
                
                <div class="telemetry-block" style="padding: 20px; width:100%; display:flex; flex-direction:column; gap:12px;">
                    <div style="font-size:13px; color:#8fa0b3; line-height:1.6;">
                        Tributo interactivo no comercial inspirado en <strong style="color:#ffffff;">INTERSTELLAR (2014)</strong> de Christopher Nolan y Hans Zimmer.
                    </div>
                    
                    <div style="border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin: 4px 0;"></div>
                    
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; text-align:left; font-size:12px; line-height:1.4;">
                        <div><span style="color:#ff7800;">DIRECCIÓN CREATIVA</span><br><span style="color:#ffffff;">Anigami Agadni</span></div>
                        <div><span style="color:#ff7800;">ARQUITECTURA NARRATIVA</span><br><span style="color:#ffffff;">Silas (Cronista del Yermo)</span></div>
                        <div><span style="color:#00dcff;">INGENIERÍA & CÓDIGO</span><br><span style="color:#ffffff;">Nexo (0 KB Framework)</span></div>
                        <div><span style="color:#00dcff;">DIRECCIÓN VISUAL & PIXEL ART</span><br><span style="color:#ffffff;">Pix (Aseprite Master)</span></div>
                        <div><span style="color:#00ff66;">DISEÑO SONORO</span><br><span style="color:#ffffff;">Hertz (Web Audio API)</span></div>
                        <div><span style="color:#00ff66;">ESTRATEGIA TRANSMEDIA</span><br><span style="color:#ffffff;">Éter (Difusión)</span></div>
                    </div>
                </div>

                <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
                    <button class="btn-orbit" id="credits-restart-btn" style="border-color:#ff7800; color:#ff7800;">↺ Iniciar Nueva Simulación</button>
                    <a href="https://humania-nexo.github.io/arcade-enramado/" class="btn-orbit" style="text-decoration:none; display:inline-flex; align-items:center;">[ VOLVER AL ARCADE ENRAMADO ]</a>
                </div>
            `;

            mainPanel.appendChild(container);

            document.getElementById('credits-restart-btn').addEventListener('click', () => {
                changePhase('welcome');
            });
        }

        changePhase('welcome');
    </script>
